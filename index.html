<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sara 🎂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe4ec, #fff5d7);
  color: #5b3042;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 35px 20px;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

h2 {
  font-size: 28px;
}

.message {
  font-size: 18px;
  line-height: 1.8;
  margin: 25px 0;
}

.photo {
  width: 100%;
  max-width: 500px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  margin: 20px auto;
  display: block;
}

button {
  border: none;
  background: #e85d8e;
  color: white;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #d94378;
}

#surprise {
  display: none;
  margin-top: 25px;
  font-size: 22px;
}

.heart {
  position: fixed;
  font-size: 25px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  0% {
    transform: translateY(-100px);
    opacity: 1;
  }

  100% {
    transform: translateY(100vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎂 Happy Birthday Sara 🎂</h1>

  <h2>💗 To My Beautiful Friend 💗</h2>

  <p class="message">
    كل سنة وإنتِ طيبة يا سارة ❤️<br>
    وديما معايا وجنبي بحبك اكتر من اي حد 
       عملنا ذكريات حلوه كتير   ✨
  </p>

  <img
    class="photo"
    src="20250610_001333_IMG_0968.JPG"
    alt="Sara Memory">

  <p class="message">
    بعض الصور بتفضل مجرد صورة...<br>
    لكن في صور بتفضل ذكرى عمر كامل 🥹❤️
  </p>

  <button onclick="showSurprise()">
    🎁 Surprise Sara
  </button>

  <div id="surprise">
    🎉 بحبك يا سارة ❤️<br>
    وإن شاء الله كل أيامك تكون أحلى من اللي قبلها ✨
  </div>

</div>

<script>
function showSurprise() {
  document.getElementById("surprise").style.display = "block";

  for (let i = 0; i < 25; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }
}
</script>

</body>
</html>
