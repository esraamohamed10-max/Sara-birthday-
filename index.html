<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 33rd Birthday Sara 🎂</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{

#intro{

}

.message{

}

.photo-box:hover{
transform:translateY(-5px);
}

.photo-box img{
width:100%;
height:250px;
object-fit:cover;
border-radius:15px;
display:block;
}

.reasons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:14px;
}

.reason{
background:rgba(255,255,255,.8);
padding:18px;
border-radius:20px;
text-align:center;
font-size:17px;
box-shadow:0 7px 20px rgba(80,30,50,.1);
}

.final{
min-height:70vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.final-box{
max-width:750px;
background:rgba(255,255,255,.85);
padding:35px 22px;
border-radius:32px;
box-shadow:0 15px 50px rgba(80,30,50,.15);
}

.final-box h2{
font-size:45px;
color:#c43c73;
}

#surprise{
display:none;
font-size:24px;
line-height:1.9;
margin-top:25px;
}

.music{
position:fixed;
left:12px;
bottom:12px;
z-index:500;
background:white;
padding:8px;
border-radius:50px;
box-shadow:0 6px 20px rgba(0,0,0,.15);
}

.music button{
padding:10px 16px;
font-size:14px;
}

.heart{
position:fixed;
top:-40px;
z-index:999;
pointer-events:none;
animation:fall 5s linear forwards;
}
